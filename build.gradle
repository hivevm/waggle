plugins {
    id 'com.gradle.plugin-publish' version '2.2.1'
    // Bootstrap: the published generator regenerates this project's own parser (ADR-0009).
    id 'org.hivevm.waggle' version '1.0.14'
    id 'java-gradle-plugin'
    id 'maven-publish'
}


repositories {
    mavenLocal()
    mavenCentral()
}


group	= 'org.hivevm'


java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}


tasks.withType(Javadoc).configureEach {
    enabled = false
}


// Static analysis. "this-escape" is off because the model's constructors register the node with
// its parent, which is the shape of the AST and not a defect to be silenced case by case.
//
// Not -Werror: compileJava also compiles src/main/generated, whose content comes from the
// published generator rather than from this tree, so a warning there would gate a build nobody
// here can fix. What this repository writes by hand is held to zero by SourceHygieneTest.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:all,-this-escape'
}


dependencies {
    // https://mvnrepository.com/artifact/org.jspecify/jspecify
    implementation("org.jspecify:jspecify:1.0.1")

    // Use JUnit test framework//
    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation("org.junit.jupiter:junit-jupiter:6.1.3")
    // https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
    testImplementation("org.junit.platform:junit-platform-launcher:6.1.3")
}


// The version is defined once, in gradle.properties. generateVersion copies the templates in
// src/main/templates with it filled in, so the generator reads it as a compiled constant.
def generateVersion = tasks.register('generateVersion', Copy) {
    inputs.property('version', project.version)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/version')
    expand(version: project.version)
}

sourceSets {
    main {
        java {
            srcDirs += 'src/main/gradle'
            // The generated parser (src/main/generated) is the output of generateParser. Adding the
            // task instead of the bare path makes compileJava and sourcesJar depend on it.
            srcDir(tasks.named('generateParser'))
            srcDir(generateVersion)
        }
    }
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Implementation-Title': 'HiveVM Waggle'
        attributes 'Implementation-Version': project.version
    }

    exclude('Waggle.waggle')
}


// Configured to publish your plugin to the plugin portal
gradlePlugin {
  website = 'https://www.hivevm.org'
  vcsUrl  = 'https://github.com/hivevm/waggle.git'
  plugins {
    create("gradle") {
      id = 'org.hivevm.waggle'
            displayName = 'HiveVM Waggle'
            description = 'HiveVM parser generator for Java/C++/Rust'
            implementationClass = 'org.hivevm.gradle.WagglePlugin'
            tags.set(["hivevm", "waggle", "parser generator"])
        }
    }
}


parserProject {
  target       = 'java'
  output       = 'src/main/generated'

  task {
    name       = 'parser'
    file       = 'src/main/resources/Waggle.waggle'
  }
}
